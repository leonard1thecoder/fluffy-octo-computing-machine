[package]
name = "nhlanganiso-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "nhlanganiso_api"
path = "src/lib.rs"

[[bin]]
name = "nhlanganiso-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "form", "query", "matched-path"] }
tokio = { version = "1", features = ["full", "tracing"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate", "uuid", "chrono", "json", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
subtle = "2.6"
md5 = "0.8"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit", "timeout", "normalize-path"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
redis = { version = "0.27", features = ["tokio-comp", "tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "rustls-tls"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
urlencoding = "2.1"
http = "1"
http-body-util = "0.1"
async-trait = "0.1"

[dev-dependencies]
axum-test = "16"
tokio-test = "0.4"
wiremock = "0.6"
